org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom does not support Gradle's configuration cache.
org.gradle.configuration-cache=false

# Fabric Loom / Minecraft
# 26.1 was the first unobfuscated Minecraft release, so there is no `mappings`
# dependency any more and nothing is remapped — see build.gradle.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.155.2+26.2
loom_version=1.17.17
modmenu_version=20.0.1
lambdynlights_version=4.12.2+26.2
yumi_commons_version=2.0.0
# Compiled against, never shipped. Pinned to the oldest release carrying the API this mod uses
# rather than the newest, because the compile classpath decides the minimum a player can run.
#
# Raising it is not free and not automatic: Controlify renames things between releases without
# leaving an alias — BasicRumbleEffect.join became seq — and a compileOnly dependency turns that
# into a NoSuchMethodError in a player's game rather than an error here. The compat package is
# written against members that exist in both this version and the newest, checked by hand.
controlify_version=3.2.1+mc26.2

# Mod
# The 26.2 port carries its own version line so a jar can never be confused with
# a 1.21.1 build (which stopped at 0.1.45 on main).
mod_version=2.15.4-26.2
maven_group=dev.jsz.primordia
archives_base_name=primordia
